name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build chunk-enabled frontend
        run: |
          FRONTEND_DIR=/tmp/openlist-frontend
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git "$FRONTEND_DIR"
          cp -r frontend/src/pages/home/uploads/* "$FRONTEND_DIR/src/pages/home/uploads/"
          cd "$FRONTEND_DIR"
          pnpm install
          pnpm add crc-32
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/public/dist" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/public/dist"
          cp -r dist/* "$GITHUB_WORKSPACE/public/dist/"
          echo "Frontend built successfully"

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build binary
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=0
          BUILT_AT="$(date +'%F %T %z')"
          GIT_COMMIT="$(git log --pretty=format:'%h' -1 2>/dev/null || echo 'unknown')"
          VERSION="$(git describe --abbrev=0 --tags 2>/dev/null || echo 'v0.0.0')"
          LDFLAGS="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList_Chunk Contributors' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${VERSION}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=chunk-custom' \
          "
          mkdir -p build
          go build -ldflags="$LDFLAGS" -tags=jsoniter -o "build/openlist-${{ matrix.name }}" .

      - name: Verify binary
        run: |
          file build/openlist-${{ matrix.name }}
          ls -lh build/openlist-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist_${{ github.sha }}_${{ matrix.name }}
          path: build/*

  windows:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build chunk-enabled frontend
        shell: bash
        run: |
          FRONTEND_DIR="/tmp/openlist-frontend"
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git "$FRONTEND_DIR"
          cp -r frontend/src/pages/home/uploads/* "$FRONTEND_DIR/src/pages/home/uploads/"
          cd "$FRONTEND_DIR"
          pnpm install
          pnpm add crc-32
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/public/dist" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/public/dist"
          cp -r dist/* "$GITHUB_WORKSPACE/public/dist/"
          echo "Frontend built successfully"

      - name: Tidy dependencies
        shell: bash
        run: go mod tidy

      - name: Build binary
        shell: bash
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=0
          BUILT_AT="$(date +'%F %T %z')"
          GIT_COMMIT="$(git log --pretty=format:'%h' -1 2>/dev/null || echo 'unknown')"
          VERSION="$(git describe --abbrev=0 --tags 2>/dev/null || echo 'v0.0.0')"
          LDFLAGS="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList_Chunk Contributors' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${VERSION}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=chunk-custom' \
          "
          mkdir -p build
          go build -ldflags="$LDFLAGS" -tags=jsoniter -o "build/openlist-${{ matrix.name }}${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist_${{ github.sha }}_${{ matrix.name }}
          path: build/*
