name: Docker

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME || 'zmabin' }}/openlist-chunk

jobs:
  prepare-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build chunk-enabled frontend
        shell: bash
        run: |
          FRONTEND_DIR=/tmp/openlist-frontend
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git "$FRONTEND_DIR"
          cp -r frontend/src/pages/home/uploads/* "$FRONTEND_DIR/src/pages/home/uploads/"
          cd "$FRONTEND_DIR"
          FRONTEND_RELEASE=$(curl -fsSL \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/OpenListTeam/OpenList-Frontend/releases/latest")
          I18N_URL=$(echo "$FRONTEND_RELEASE" | grep -oP '"browser_download_url":\s*"\K[^"]*' | grep "i18n.tar.gz")
          if [ -n "$I18N_URL" ]; then
            curl -fsSL "$I18N_URL" -o i18n.tar.gz
            tar -xzf i18n.tar.gz -C src/lang
            rm -f i18n.tar.gz
            echo "i18n translations downloaded"
          else
            echo "Warning: i18n.tar.gz not found, building with English only"
          fi
          pnpm install --config.block-exotic-subdeps=false
          pnpm add --config.block-exotic-subdeps=false crc-32
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/public/dist" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/public/dist"
          cp -r dist/* "$GITHUB_WORKSPACE/public/dist/"
          echo "Frontend built successfully"

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: public/dist/

  docker:
    name: Build and push Docker image
    needs: prepare-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags
        id: meta
        run: |
          TAGS="${{ env.IMAGE_NAME }}:latest"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${VERSION}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${VERSION#v}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${TAGS},${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: SKIP_FRONTEND=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ghcr:
    name: Build and push to ghcr.io
    needs: prepare-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: public/dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/openlist-chunk"
          TAGS="${IMAGE}:latest"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="${TAGS},${IMAGE}:${VERSION}"
            TAGS="${TAGS},${IMAGE}:${VERSION#v}"
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${TAGS},${IMAGE}:${SHORT_SHA}"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: SKIP_FRONTEND=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
