name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  unix:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: linux-amd64
          - goos: linux
            goarch: arm64
            name: linux-arm64
          - goos: darwin
            goarch: amd64
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            name: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build chunk-enabled frontend
        run: |
          FRONTEND_DIR=/tmp/openlist-frontend
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git "$FRONTEND_DIR"
          cp -r frontend/src/pages/home/uploads/* "$FRONTEND_DIR/src/pages/home/uploads/"
          cd "$FRONTEND_DIR"
          pnpm install
          pnpm add crc-32
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/public/dist" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/public/dist"
          cp -r dist/* "$GITHUB_WORKSPACE/public/dist/"
          echo "Frontend built successfully"

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build binary
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=0
          BUILT_AT="$(date +'%F %T %z')"
          GIT_COMMIT="$(git log --pretty=format:'%h' -1 2>/dev/null || echo 'unknown')"
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList_Chunk Contributors' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${VERSION}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=chunk-custom' \
          "
          mkdir -p dist
          go build -ldflags="$LDFLAGS" -tags=jsoniter -o "dist/openlist-${{ matrix.name }}" .

      - name: Verify binary
        run: |
          file dist/openlist-${{ matrix.name }}
          ls -lh dist/openlist-${{ matrix.name }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: openlist-${{ matrix.name }}
          path: dist/*

  windows:
    name: Build ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-amd64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Build chunk-enabled frontend
        shell: bash
        run: |
          FRONTEND_DIR="/tmp/openlist-frontend"
          git clone --depth 1 https://github.com/OpenListTeam/OpenList-Frontend.git "$FRONTEND_DIR"
          cp -r frontend/src/pages/home/uploads/* "$FRONTEND_DIR/src/pages/home/uploads/"
          cd "$FRONTEND_DIR"
          pnpm install
          pnpm add crc-32
          pnpm build
          rm -rf "$GITHUB_WORKSPACE/public/dist" 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/public/dist"
          cp -r dist/* "$GITHUB_WORKSPACE/public/dist/"
          echo "Frontend built successfully"

      - name: Tidy dependencies
        shell: bash
        run: go mod tidy

      - name: Build binary
        shell: bash
        run: |
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_ENABLED=0
          BUILT_AT="$(date +'%F %T %z')"
          GIT_COMMIT="$(git log --pretty=format:'%h' -1 2>/dev/null || echo 'unknown')"
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-w -s \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=OpenList_Chunk Contributors' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${VERSION}' \
            -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=chunk-custom' \
          "
          mkdir -p dist
          go build -ldflags="$LDFLAGS" -tags=jsoniter -o "dist/openlist-${{ matrix.name }}${{ matrix.ext }}" .

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          sha256sum openlist-${{ matrix.name }}* > openlist-${{ matrix.name }}.sha256
          cat openlist-${{ matrix.name }}.sha256

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: openlist-${{ matrix.name }}
          path: dist/*

  release:
    name: Create Release
    needs: [unix, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## OpenList_Chunk ${{ github.ref_name }}

            Auto-built from OpenList upstream with chunk upload support.

            ### Features
            - **Chunk Upload**: Form mode auto-splits large files into 95MB chunks
            - **Stream Chunking**: Stream mode also supports chunked upload
            - **Integrity Verification**: CRC32 per-chunk + xxHash64 whole-file verification
            - **Server-side Upload ID**: Secure UUID-based upload session management

            ### Files
            - **openlist-linux-amd64** — Linux x86_64
            - **openlist-linux-arm64** — Linux ARM64
            - **openlist-darwin-amd64** — macOS Intel
            - **openlist-darwin-arm64** — macOS Apple Silicon
            - **openlist-windows-amd64.exe** — Windows x86_64
          files: release-assets/**/*
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
