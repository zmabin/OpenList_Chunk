name: Sync Upstream

on:
  schedule:
    - cron: '0 2 */3 * *'  # Every 3 days at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync from upstream OpenList
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/OpenListTeam/OpenList.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Capture upstream version info
        id: upstream-info
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          UPSTREAM_SHORT=$(git log --pretty=format:'%h %s' -1 upstream/main)
          echo "sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          echo "summary=${UPSTREAM_SHORT}" >> $GITHUB_OUTPUT

      - name: Merge upstream and auto-resolve conflicts
        id: merge
        run: |
          # Save our fork's SHA to restore fork-only files after merge
          OUR_SHA=$(git rev-parse HEAD)

          # Check if there's anything new to sync
          NEW_COMMITS=$(git rev-list --count HEAD..upstream/main)
          if [ "$NEW_COMMITS" = "0" ]; then
            echo "Already up to date with upstream, nothing to sync."
            exit 0
          fi
          echo "Found $NEW_COMMITS new upstream commit(s)."

          # Files that are fork-specific and must never come from upstream
          FORK_ONLY_FILES=(
            "CLAUDE.md"
            "LICENSE"
            "Dockerfile"
            "docker-compose.yml"
            ".github/workflows/build.yml"
            ".github/workflows/release.yml"
            ".github/workflows/docker.yml"
            ".github/workflows/sync-upstream.yml"
          )

          # Protect all README files (README.md, README_cn.md, README_ja.md, etc.)
          for readmefile in README*.md; do
            FORK_ONLY_FILES+=("$readmefile")
          done

          # Files that should keep our version on conflict
          CHUNK_FILES=(
            "server/handles/fsup.go"
            "server/handles/fsup_chunk.go"
            "server/router.go"
            "server/static/static.go"
            "internal/model/storage.go"
            "internal/op/storage.go"
            "internal/conf/const.go"
            "internal/bootstrap/data/setting.go"
            "internal/bootstrap/config.go"
            "pkg/cron/cron.go"
            "pkg/cron/cron_test.go"
            "conf.d/openlist.conf"
          )

          # Also protect all frontend chunk upload files
          FRONTEND_CHUNK_FILES=$(find frontend/src/pages/home/uploads -type f 2>/dev/null || true)
          for file in $FRONTEND_CHUNK_FILES; do
            CHUNK_FILES+=("$file")
          done

          # Try a clean merge first
          if git merge upstream/main --no-edit; then
            echo "Merge succeeded without conflicts."
          else
            echo "Conflicts detected. Auto-resolving..."

            # Restore our chunk files (keep fork version)
            for file in "${CHUNK_FILES[@]}"; do
              if git ls-files -u -- "$file" | grep -q "^"; then
                echo "Keeping fork version of: $file"
                git checkout --ours "$file" 2>/dev/null
                git add "$file"
              fi
            done

            # Accept upstream for remaining conflicting files
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null)
            if [ -n "$CONFLICTS" ]; then
              for file in $CONFLICTS; do
                echo "Accepting upstream version of: $file"
                git checkout --theirs "$file"
                git add "$file"
              done
            fi

            # Verify no conflicts remain
            if [ -n "$(git diff --name-only --diff-filter=U 2>/dev/null)" ]; then
              echo "ERROR: Unresolved conflicts remaining!"
              git status
              exit 1
            fi

            git commit -m "chore: merge upstream changes and auto-resolve conflicts" --no-verify
          fi

          # Always restore fork-only files (regardless of merge result)
          NEED_AMEND=false
          for file in "${FORK_ONLY_FILES[@]}"; do
            if ! git diff --quiet "$OUR_SHA" -- "$file" 2>/dev/null; then
              echo "Restoring fork version of: $file"
              git checkout "$OUR_SHA" -- "$file"
              git add "$file"
              NEED_AMEND=true
            fi
          done

          if [ "$NEED_AMEND" = true ]; then
            git commit --amend --no-edit --no-verify
          fi

          echo "result=synced" >> $GITHUB_OUTPUT

      - name: Setup Go
        if: steps.merge.outputs.result == 'synced'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Verify compilation
        if: steps.merge.outputs.result == 'synced'
        run: |
          CGO_ENABLED=0 go mod tidy
          CGO_ENABLED=0 go build -tags=jsoniter .

      - name: Push synced changes
        if: steps.merge.outputs.result == 'synced'
        run: |
          UPSTREAM_INFO="${{ steps.upstream-info.outputs.summary }}"
          # Amend commit with upstream version info
          git commit --amend -m "chore: sync upstream (${UPSTREAM_INFO})" --no-verify
          git push origin HEAD:refs/heads/main

      - name: Propagate upstream release tag
        if: steps.merge.outputs.result == 'synced'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the latest upstream release via GitHub API
          UPSTREAM_RELEASE=$(gh api repos/OpenListTeam/OpenList/releases/latest \
            --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "No upstream release found, skipping."
            exit 0
          fi
          echo "Latest upstream release: $UPSTREAM_RELEASE"
          # Check if we already have this tag locally
          if git rev-parse "refs/tags/$UPSTREAM_RELEASE" >/dev/null 2>&1; then
            echo "Tag $UPSTREAM_RELEASE already exists locally, skipping."
            exit 0
          fi
          # Check if tag exists on remote (catches fresh checkout without tags)
          if git ls-remote --tags origin "refs/tags/$UPSTREAM_RELEASE" | grep -q "refs/tags/$UPSTREAM_RELEASE"; then
            echo "Tag $UPSTREAM_RELEASE already exists on remote, skipping."
            exit 0
          fi
          echo "Creating tag $UPSTREAM_RELEASE at HEAD"
          git tag "$UPSTREAM_RELEASE" HEAD
          git push origin "refs/tags/$UPSTREAM_RELEASE"
          echo "Tag $UPSTREAM_RELEASE pushed."

      - name: Trigger release workflow
        if: steps.merge.outputs.result == 'synced'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_RELEASE=$(gh api repos/OpenListTeam/OpenList/releases/latest \
            --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$UPSTREAM_RELEASE" ]; then
            echo "No upstream release tag found, skipping release trigger."
            exit 0
          fi
          # Check if a release already exists for this tag
          EXISTING=$(gh release view "$UPSTREAM_RELEASE" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Release $UPSTREAM_RELEASE already exists, skipping."
            exit 0
          fi
          echo "Triggering release workflow for $UPSTREAM_RELEASE"
          gh workflow run release.yml --ref main -f tag="$UPSTREAM_RELEASE"

      - name: Create issue on failure
        if: failure()
        run: |
          UPSTREAM_INFO="${{ steps.upstream-info.outputs.summary }}"
          gh issue create \
            --title "Upstream sync failed ($(date +%Y-%m-%d))" \
            --body "The automated upstream sync workflow failed.

          **Upstream commit:** ${UPSTREAM_INFO}

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Please review the workflow logs and resolve manually." \
            --label "sync-failure" || true

      - name: Sync result
        run: |
          if [ "${{ steps.merge.outputs.result }}" = "synced" ]; then
            echo "Upstream changes have been synced successfully."
          else
            echo "No changes to sync."
          fi
